{% load static %}{% comment %}
The mark and headings at the top of an auth card. One copy so login, signup and
the invite pages cannot drift apart.

Args: heading, subheading (optional).
{% endcomment %}
<img src="{% static 'img/quikro-automation-logo.png' %}" alt="Quikro Automation" width="56" height="56" class="mx-auto mb-4 rounded-xl shadow-md">
<h1 class="text-xl font-semibold text-center mb-1" style="color: var(--text-primary);">{{ heading }}</h1>
{% if subheading %}
<p class="text-sm text-center mb-6" style="color: var(--text-secondary);">{{ subheading }}</p>
{% endif %}
