<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="qBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="qGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="qBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="qGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle container -->
  <rect x="4" y="4" width="120" height="120" rx="32" ry="32" fill="url(#qBg)" stroke="#334155" stroke-width="2"/>

  <!-- Glowing Q Ring (Chat bubble + Gear teeth) -->
  <circle cx="60" cy="58" r="32" fill="none" stroke="url(#qGrad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="160 40" filter="url(#qGlow)"/>

  <!-- Chat bubble tail / Q tail -->
  <path d="M78 76 L102 96 L88 72 Z" fill="url(#qGrad)" filter="url(#qGlow)"/>

  <!-- Central Automation Lightning Bolt -->
  <polygon points="68,34 46,62 58,62 50,88 80,54 66,54" fill="url(#qBolt)"/>

  <!-- Pulse dots -->
  <circle cx="94" cy="40" r="4" fill="#38BDF8"/>
  <circle cx="30" cy="74" r="3" fill="#8B5CF6"/>
</svg>